# Bee TV: one command runs the whole solution.
#   docker compose up --build
# Then open http://localhost:7777
#
# Configuration comes from `.env` (optional; see `.env.example`). Every variable has a
# safe default, so the stack also starts without any `.env` file.
#
# File format 3.3: runs on legacy docker-compose (1.17+) and on Docker Compose v2.
# 3.3 has no `depends_on` health conditions, so readiness is handled by the services
# themselves: the API waits for MySQL before migrating, nginx resolves the API lazily.
version: "3.3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-beetv}
      MYSQL_USER: ${MYSQL_USER:-beetv}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-beetv}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-beetv-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP ping only succeeds once the real server is up (the init server has networking off).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./src/bee-tv-api
    image: bee-tv-api:local
    restart: unless-stopped
    environment:
      BEE_DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-beetv}:${MYSQL_PASSWORD:-beetv}@db:3306/${MYSQL_DATABASE:-beetv}
      BEE_API_PORT: ${BEE_API_PORT:-8000}
      BEE_LOG_LEVEL: ${BEE_LOG_LEVEL:-INFO}
      HF_TOKEN: ${HF_TOKEN:-}
      BEE_INSIGHT_MODEL: ${BEE_INSIGHT_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      BEE_INSIGHT_API_BASE_URL: ${BEE_INSIGHT_API_BASE_URL:-https://router.huggingface.co/v1}
    depends_on:
      - db
    expose:
      - "${BEE_API_PORT:-8000}"

  web:
    build:
      context: ./src/bee-tv-app
    image: bee-tv-app:local
    restart: unless-stopped
    environment:
      BEE_API_UPSTREAM: http://api:${BEE_API_PORT:-8000}
    depends_on:
      - api
    ports:
      - "${BEE_WEB_PORT:-7777}:7777"

volumes:
  db-data:
